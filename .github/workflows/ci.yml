name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format clang-tidy cmake g++ libsdl2-dev ninja-build

      - name: Configure Debug
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++

      - name: Check formatting
        run: >-
          find src -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0
          | xargs -0 clang-format --dry-run --Werror

      - name: Build Debug
        run: cmake --build build

      - name: Run clang-tidy
        run: >-
          find src -type f -name '*.cpp' -print0
          | xargs -0 clang-tidy -p build

      - name: Configure sanitizers
        run: >-
          cmake -S . -B build-sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++
          -DCROOM_ENABLE_SANITIZERS=ON

      - name: Build sanitizers
        run: cmake --build build-sanitize
